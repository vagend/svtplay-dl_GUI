# Builds the Mac app and the Windows program every time you push, and puts them on the
# repo's Releases page as the latest release. The app checks that release to update itself.
name: Build apps

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "screenshot.png"]
  workflow_dispatch:   # lets you start a build from the Actions tab

permissions:
  contents: write      # needed to publish the release

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            label: mac
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Stamp build number
        shell: bash
        run: |
          echo "${{ github.run_number }}" > APP_BUILD
          echo "${{ github.repository }}" > APP_REPO

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build
        run: pyinstaller --noconfirm --clean svtplay-dl-gui.spec

      - name: Test automatic downloads
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            python ci/test_schedule.py "dist/svtplay-dl GUI.app/Contents/MacOS/svtplay-dl GUI"
          else
            python ci/test_schedule.py "dist/svtplay-dl GUI.exe"
          fi

      - name: Zip and installer (Mac)
        if: runner.os == 'macOS'
        run: |
          # the zip is what the app downloads to update itself
          ditto -c -k --sequesterRsrc --keepParent "dist/svtplay-dl GUI.app" dist/svtplay-dl-GUI-mac.zip
          # the .dmg opens a window with the app and an arrow to Applications
          python -m pip install dmgbuild
          tiffutil -cathidpicheck assets/dmg-background.png assets/dmg-background@2x.png -out dist/dmg-background.tiff
          dmgbuild -s packaging/dmg_settings.py -D "app=dist/svtplay-dl GUI.app" -D background=dist/dmg-background.tiff \
            "svtplay-dl GUI" dist/svtplay-dl-GUI-mac.dmg
          hdiutil verify dist/svtplay-dl-GUI-mac.dmg

      - name: Zip and installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # the zip is what the app downloads to update itself
          Compress-Archive -Path "dist/svtplay-dl GUI.exe" -DestinationPath dist/svtplay-dl-GUI-windows.zip
          # the installer: per-user, Start menu, Settings > Apps entry with Uninstall
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (!(Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          $v = (Get-Content VERSION).Trim()
          & $iscc "/DAppVersion=$v" "/DSourceExe=$PWD\dist\svtplay-dl GUI.exe" "/O$PWD\dist" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\svtplay-dl GUI"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\svtplay-dl GUI.lnk"
          Start-Process dist\svtplay-dl-GUI-windows-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (!(Test-Path "$app\svtplay-dl GUI.exe")) { throw "app not installed" }
          if (!(Test-Path $lnk)) { throw "no Start menu entry" }
          $u = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object DisplayName -eq "svtplay-dl GUI"
          if (!$u) { throw "not listed under Apps" }
          "Installed: $($u.DisplayName) $($u.DisplayVersion)"
          # turn on automatic downloads, so we can check the uninstaller removes the scheduled task
          Start-Process "$app\svtplay-dl GUI.exe" -ArgumentList "--set-schedule","04:00" -Wait
          schtasks /Query /TN "svtplay-dl GUI new episodes" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed app couldn't create its scheduled task" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$app\svtplay-dl GUI.exe") { throw "uninstall left the app behind" }
          if (Test-Path $lnk) { throw "uninstall left the Start menu entry" }
          schtasks /Query /TN "svtplay-dl GUI new episodes" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "uninstall left the scheduled task" }
          $global:LASTEXITCODE = 0
          "Uninstalled cleanly"

      - uses: actions/upload-artifact@v5
        with:
          name: svtplay-dl-GUI-${{ matrix.label }}
          path: |
            dist/svtplay-dl-GUI-${{ matrix.label }}.zip
            dist/svtplay-dl-GUI-${{ matrix.label }}.dmg
            dist/svtplay-dl-GUI-${{ matrix.label }}-setup.exe
          if-no-files-found: error
          retention-days: 3   # only needed until the release step; keeps storage use tiny

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Publish "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(gh api "repos/$GH_REPO/contents/VERSION?ref=$GITHUB_SHA" --jq .content | base64 -d | tr -d '[:space:]')
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.zip out/*.dmg out/*.exe \
            --target "$GITHUB_SHA" \
            --title "svtplay-dl GUI $VERSION (build ${{ github.run_number }})" \
            --latest \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC.

          **Mac:** download svtplay-dl-GUI-mac.dmg and open it. In the window that appears, drag *svtplay-dl GUI* onto the Applications folder.
          **Windows:** download svtplay-dl-GUI-windows-setup.exe and run it. It installs just for you (no admin needed), adds svtplay-dl GUI to the Start menu, and can be uninstalled from Settings > Apps.
          (The .zip files are what the app uses to update itself.)

          The first time you open it, your computer warns that the app isn't from a known developer. See the README for the two clicks that get past this."
